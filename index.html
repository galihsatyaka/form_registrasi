<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="form-box">
            <h2>Form Registrasi</h2>
            <form>
                <input type="email" placeholder="Masukkan email" aria-label="Email" required>
                <input type="password" placeholder="Masukkan password" aria-label="Password" required>
                <input type="password" placeholder="Masukkan ulang password" aria-label="Ulangi password" required>
                <button type="submit">Daftar</button>
            </form>
            <p>Sudah punya akun? <a href="no1_login.html">Login</a></p>
        </section>
    </main>
</body>
</html>
